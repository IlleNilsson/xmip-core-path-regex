# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-path-regex"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-path-regex"
description = "Regular-expression path technology: the first match or a named group of a pattern reads from a text Stream and a match writes into it, linear time, no document built, for promote, demote, route and process. A xmip-core-path technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathEngine trait lives in path; the structure
# reader and writer traits it drives live in contract.
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The one real engine, the same one the regex contract validates with: finite
# automata, linear in the input, so an operator's pattern cannot stall a scan.
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
